{% extends 'base.html' %}
{% block title %}SignUp{% endblock %}
{% block content %}
    <div>
        <h2>Sign Up</h2>
        <form method='post'>
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div>
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type='submit'>Sign Up</button>
        </form>
        <p>Already have an accoint?<a href='{% url 'movies:login' %}'>Login</a></p>
    </div>
{% endblock %}
